<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ebee">
<title>F1 Liga</title>
<meta name="description" content="Súkromná F1 liga: poradie, výsledky pretekov a štatistiky.">
<meta property="og:title" content="F1 Liga">
<meta property="og:description" content="Súkromná F1 liga: poradie, výsledky pretekov a štatistiky.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%230d0f12'/><rect x='10' y='10' width='22' height='44' fill='%23e10600'/><rect x='36' y='10' width='18' height='20' fill='%23e9ebee'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e9ebee; --card:#f6f7f9; --ink:#0d0f12; --mid:#5b6170; --soft:#8a909c; --rule:#c9cdd4; --red:#e10600;
  --gold:#e8b71a; --silver:#a9b0bb; --bronze:#c67a3f; --purple:#7c4dff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.num{font-variant-numeric:tabular-nums}
.d{font-family:var(--display);font-weight:900;line-height:.86;letter-spacing:-.2px}
.up{text-transform:uppercase}
.mid{color:var(--mid)} .soft{color:var(--soft)}
h1,h2,h3{margin:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}}
@media (max-width:700px){.wrap{padding:0 16px}}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 20px;font-weight:700;font-size:15px;border:2px solid var(--ink);background:transparent;color:var(--ink);transition:background .12s,color .12s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:#2a2e36}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:#c40500;border-color:#c40500}
.btn.quiet{border-color:transparent}
.btn.quiet:hover{background:rgba(13,15,18,.07);color:var(--ink)}
.btn.sm{padding:6px 14px;font-size:13.5px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:transparent;color:var(--ink)}
.btn.solid:disabled:hover,.btn.red:disabled:hover{background:var(--ink);color:var(--paper)}
.input{width:100%;background:#fff;border:2px solid var(--rule);border-radius:999px;padding:11px 18px;color:var(--ink)}
.input:focus{outline:none;border-color:var(--ink)}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
label.f{display:grid;gap:6px;font-size:13.5px;font-weight:600;color:var(--mid)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 16px;font-weight:700;font-size:14px;color:var(--mid)}
.seg button.on{background:var(--ink);color:var(--paper)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.red{background:var(--red);border-color:var(--red);color:#fff}
.pill.amber{background:var(--gold);border-color:var(--gold)}
.sw{display:inline-block;width:12px;height:12px;background:var(--c);flex:none}
.fl{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--purple);vertical-align:middle;margin-left:4px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:999px;z-index:80;font-weight:600;box-shadow:0 14px 40px rgba(13,15,18,.25);max-width:92vw;animation:tin .2s ease-out}
.toast.err{background:var(--red);color:#fff}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--mid)}
.empty{padding:40px 20px;text-align:center;color:var(--mid)}
.hint{font-size:13.5px;color:var(--mid);margin:8px 0}

/* ---------- header ---------- */
header.bar{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--ink)}
.bar-in{display:flex;align-items:center;gap:26px;height:64px}
.mark{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;text-decoration:none;letter-spacing:.3px;display:flex;align-items:center;gap:10px;flex:none}
.mark i{width:12px;height:26px;background:var(--red)}
nav.tabs{display:flex;gap:22px;flex:1;min-width:0;align-self:stretch}
nav.tabs button{background:none;border:0;padding:0;font-weight:600;font-size:15px;color:var(--mid);display:flex;align-items:center;gap:7px;position:relative;white-space:nowrap}
nav.tabs button svg{width:17px;height:17px;display:none}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:5px;background:var(--ink)}
.badge{font-style:normal;background:var(--red);color:#fff;border-radius:999px;min-width:19px;height:19px;padding:0 5px;font-size:11.5px;font-weight:800;display:inline-grid;place-items:center;line-height:1}
@media (max-width:900px){nav.tabs button .badge{position:absolute;top:2px;right:18%}}
.bar-r{display:flex;align-items:center;gap:8px;flex:none}
.sel{background-color:transparent;border:2px solid var(--ink);border-radius:999px;padding:6px 32px 6px 14px;font-weight:700;appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.ibtn{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);background:transparent;display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--ink);color:var(--paper)}
.ibtn svg{width:17px;height:17px}
.avatar{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;background:var(--c,var(--ink));color:var(--t,#fff);flex:none}
@media (max-width:900px){
  body.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .bar-in{height:58px;gap:12px}
  .mark{font-size:26px}
  nav.tabs{align-self:auto;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:40;gap:0;justify-content:space-around;padding:5px;border-radius:999px;
    background:rgba(246,247,249,.72);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(13,15,18,.12);box-shadow:0 14px 40px rgba(13,15,18,.18)}
  nav.tabs button{flex-direction:column;gap:2px;font-size:10.5px;padding:7px 2px;flex:1;max-width:92px;border-radius:999px}
  nav.tabs button svg{display:block;width:20px;height:20px}
  nav.tabs button.on{background:var(--ink);color:var(--paper)}
  nav.tabs button.on::after{display:none}
  .sel{max-width:40vw}
}

/* ---------- page head ---------- */
main{padding:28px 0 60px}
body.gate-on main{padding:0}
body.gate-on header.bar{display:none}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:0}
.phead h1{font-family:var(--display);font-weight:900;font-size:clamp(56px,8vw,104px);line-height:.82;text-transform:uppercase}
.phead .side{color:var(--mid);font-weight:600;font-size:15px;text-align:right}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:40px 0 0;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.sec h2{font-family:var(--display);font-weight:900;font-size:36px;line-height:.9;text-transform:uppercase}
.sec .side{color:var(--mid);font-size:14.5px;font-weight:600}
.link{background:none;border:0;padding:0;font-weight:700;font-size:14.5px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

/* ---------- position chip ---------- */
.pos{display:inline-grid;place-items:center;width:30px;height:30px;font-family:var(--display);font-weight:900;font-size:20px;background:var(--ink);color:var(--paper);flex:none}
.pos.p1{background:var(--gold);color:var(--ink)}.pos.p2{background:var(--silver);color:var(--ink)}.pos.p3{background:var(--bronze);color:var(--ink)}
.pos.s{width:24px;height:24px;font-size:16px}

/* ---------- GATE ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr}
.gate-l{padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;border-right:2px solid var(--ink);position:relative;overflow:hidden}
.gate-l .mark{font-size:26px}
.gate-title{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(110px,15vw,240px);line-height:.8;letter-spacing:-2px;margin:26px 0 22px;overflow-wrap:normal;word-break:keep-all}
.gate-sub{font-size:19px;max-width:30em;margin:0;color:var(--mid);font-weight:500}
.gate-r{padding:40px 48px;display:flex;flex-direction:column;justify-content:center;background:var(--card)}
.gate-r h2{font-family:var(--display);font-weight:900;font-size:56px;text-transform:uppercase;line-height:.85;margin:22px 0 8px}
.gate-r .lead{color:var(--mid);margin:0 0 22px}
.lights{display:flex;gap:10px;margin-top:40px}
.pod{width:62px;padding:10px 0;background:var(--ink);display:grid;gap:10px;justify-items:center}
.pod i{width:36px;height:36px;border-radius:50%;background:#2a1013;transition:background .08s,box-shadow .08s}
.pod.on i{background:#ff2a1f;box-shadow:0 0 16px 3px rgba(255,42,31,.65)}
.gate.seq .gate-title,.gate.seq .gate-sub,.gate.seq .gate-r>*{opacity:0}
.gate.go .gate-title{animation:launch .55s cubic-bezier(.2,.9,.2,1) both}
.gate.go .gate-sub{animation:rise .5s .1s ease-out both}
.gate.go .gate-r>*{animation:rise .5s .15s ease-out both}
@keyframes launch{from{opacity:0;transform:translateX(-120px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (max-width:900px){
  .gate{grid-template-columns:1fr}
  .gate-l{border-right:0;border-bottom:2px solid var(--ink);padding:24px 18px 28px}
  .gate-r{padding:28px 18px 40px}
  .lights{gap:6px;margin-top:26px}.pod{width:46px;gap:7px;padding:7px 0}.pod i{width:26px;height:26px}
  .gate-title{font-size:clamp(84px,26vw,140px)}
  .gate-r h2{font-size:44px;margin-top:16px}
}

/* ---------- HOME POSTER ---------- */
.poster{display:grid;grid-template-columns:1.35fr 1fr;border-bottom:2px solid var(--ink)}
.big{position:relative;overflow:hidden;background:var(--c);color:var(--t);padding:26px 30px 28px;min-height:min(70vh,620px);display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.big .n{position:absolute;right:-6px;bottom:-30px;font-family:var(--display);font-weight:900;font-size:clamp(300px,36vw,520px);line-height:.75;opacity:.14;pointer-events:none}
.big small{font-weight:600;font-size:15px;position:relative}
.big h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(84px,11.5vw,184px);line-height:.8;letter-spacing:-1.5px;position:relative;white-space:nowrap}
.big .pts{font-family:var(--display);font-weight:800;font-size:36px;position:relative}
.pside{display:grid;grid-template-rows:auto 1fr;border-left:2px solid var(--ink);min-width:0}
.p23{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--ink)}
.p23>div{padding:20px 22px 22px;cursor:pointer;min-width:0}
.p23>div+div{border-left:2px solid var(--ink)}
.p23 i{display:block;width:40px;height:10px;background:var(--c);margin-bottom:14px}
.p23 b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(40px,4.4vw,62px);line-height:.85;text-transform:uppercase;white-space:nowrap}
.p23 span{font-weight:600;color:var(--mid);font-size:15px}
.list{padding:6px 22px 10px}
.row{display:grid;grid-template-columns:38px 12px 1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover .nm{text-decoration:underline;text-underline-offset:4px}
.row .p{font-family:var(--display);font-weight:900;font-size:24px}
.row .nm{font-weight:600;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .g{color:var(--soft);font-weight:600;font-size:14px}
.row b{font-family:var(--display);font-weight:900;font-size:28px;min-width:48px;text-align:right}
.rounds{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;margin-top:18px}
.rounds i{height:34px;background:var(--ink);cursor:pointer;position:relative}
.rounds i.nx{background:var(--red)}
.rounds i.f{background:transparent;border:2px solid #b8bdc6}
.rounds i:hover{outline:2px solid var(--ink);outline-offset:2px}
.cap{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-weight:600;font-size:14.5px;color:var(--mid);flex-wrap:wrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:40px;border-top:2px solid var(--ink)}
.duo>section{padding:22px 0 0}
.duo>section+section{border-left:2px solid var(--ink);padding-left:28px}
.duo>section:first-child{padding-right:28px}
.duo h3{font-family:var(--display);font-weight:900;font-size:44px;text-transform:uppercase;line-height:.85;margin:6px 0 14px}
.duo small{font-weight:600;color:var(--mid)}
.nextblk{background:var(--ink);color:var(--paper);padding:22px 24px;margin-top:4px}
.nextblk h3{font-size:64px;margin:6px 0 10px}
.nextblk p{color:#b9bec8;margin:0 0 18px}
.nextblk .btn{border-color:var(--paper);color:var(--paper)}
.nextblk .btn.red{border-color:var(--red)}
.nextblk .btn:hover{background:var(--paper);color:var(--ink)}
.nextblk .btn.red:hover{background:#c40500;color:#fff}
.rr{display:grid;grid-template-columns:30px 12px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.rr:last-child{border-bottom:0}
.rr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr .pp{font-family:var(--display);font-weight:800;font-size:20px;color:var(--mid)}
@media (max-width:900px){
  .poster{grid-template-columns:1fr}
  .big{min-height:auto;padding:20px 18px 22px}
  .big h2{font-size:clamp(68px,19vw,120px);margin:40px 0 18px}
  .big .pts{font-size:28px}
  .pside{border-left:0;border-top:2px solid var(--ink)}
  .p23>div{padding:16px}
  .list{padding:4px 16px 8px}
  .duo{grid-template-columns:1fr}
  .duo>section:first-child{padding-right:0}
  .duo>section+section{border-left:0;padding-left:0;border-top:2px solid var(--ink);margin-top:28px}
  .nextblk h3{font-size:52px}
  .rounds{gap:2px}.rounds i{height:24px}
}

/* ---------- STANDINGS ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:13px;color:var(--mid);font-weight:600;text-align:right;padding:12px 10px 8px;white-space:nowrap}
.tbl td{padding:10px;border-top:1px solid var(--rule);text-align:right;white-space:nowrap}
.tbl th.l,.tbl td.l{text-align:left}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:rgba(13,15,18,.04)}
.tbl .pc{font-family:var(--display);font-weight:900;font-size:30px;width:44px;text-align:left}
.tbl .nm{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.tbl .nm i{width:12px;height:28px;background:var(--c);flex:none}
.tbl .pt{font-family:var(--display);font-weight:900;font-size:32px}
.tbl .st{font-weight:600;font-size:16px}
.tbl tr.lead td{border-top:2px solid var(--ink)}
.form{display:inline-flex;gap:3px}
.form i{width:24px;height:24px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:15px;background:#d6d9df;color:var(--ink)}
.form i.p1{background:var(--gold)}.form i.p2{background:var(--silver)}.form i.p3{background:var(--bronze)}
.form i.x{background:transparent;border:1.5px dashed #b8bdc6}
.scroll{overflow-x:auto}
@media (max-width:900px){.hide-sm{display:none}.tbl .nm{font-size:21px}.tbl .pt{font-size:26px}.tbl .pc{font-size:24px;width:30px}.tbl td,.tbl th{padding-left:6px;padding-right:6px}}
.chart-box{margin-top:0;padding:20px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.legend button{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--ink);border-radius:999px;padding:4px 12px;background:transparent;font-weight:700;font-size:13.5px}
.legend button i{width:10px;height:10px;background:var(--c)}
.legend button.off{opacity:.3}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:10px 12px;font-size:13px;min-width:170px;opacity:0;transition:opacity .1s;z-index:5}
.tip .h{font-weight:700;margin-bottom:6px}
.tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tip .r span{display:flex;align-items:center;gap:7px}

/* ---------- RACES ---------- */
.racebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.navbtns{display:flex;gap:6px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,290px);gap:14px;align-items:start;overflow-x:auto;scroll-snap-type:x proximity;scroll-behavior:smooth;padding:2px 2px 18px;scrollbar-width:thin;scrollbar-color:var(--ink) transparent}
.ticket{scroll-snap-align:start;background:var(--card);border:2px solid var(--ink);cursor:pointer}
.ticket .th{display:flex;align-items:flex-end;gap:14px;padding:14px 16px 12px;border-bottom:2px solid var(--ink)}
.ticket .th .rn{font-family:var(--display);font-weight:900;font-size:64px;line-height:.75}
.ticket .th>div{min-width:0}
.ticket .th b{display:block;font-family:var(--display);font-weight:900;font-size:30px;line-height:.9;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket .th small{color:var(--mid);font-weight:600;font-size:13px}
.ticket .tb{padding:6px 16px 10px}
.ticket.next{background:var(--ink);color:var(--paper)}
.ticket.next .th{border-color:#3a3f48}
.ticket.next small{color:#b9bec8}
.ticket.todo{background:transparent;border-style:dashed;border-color:#a3a9b3;color:var(--mid)}
.ticket.todo .th{border-color:transparent}
.ticket .tb .soon{padding:6px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.matrix{border-collapse:collapse}
.matrix th{font-size:11.5px;color:var(--mid);font-weight:600;padding:6px 2px;text-align:center}
.matrix td{padding:2px;text-align:center}
.matrix td.l,.matrix th.l{text-align:left;position:sticky;left:0;background:var(--paper);z-index:1;padding-right:14px;white-space:nowrap;font-weight:600}
.matrix .c{display:grid;place-items:center;width:30px;height:28px;font-family:var(--display);font-weight:800;font-size:16px;background:#d6d9df;position:relative}
.matrix .c.p1{background:var(--gold)}.matrix .c.p2{background:var(--silver)}.matrix .c.p3{background:var(--bronze)}
.matrix .c.e{background:transparent;color:#b8bdc6}
.matrix .c.f::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--purple)}
@media (max-width:640px){.strip{grid-auto-columns:84vw}.navbtns{display:none}}

/* ---------- DRIVERS ---------- */

<body>
<header class="bar" id="bar">
  <div class="wrap bar-in">
    <a class="mark" href="#/home" aria-label="Domov"><i></i><span id="leagueName">F1 Liga</span></a>
    <nav class="tabs" id="tabs"></nav>
    <div class="bar-r">
      <select id="seasonSel" class="sel" aria-label="Sezóna"></select>
      <button class="ibtn" id="refreshBtn" title="Obnoviť dáta" aria-label="Obnoviť dáta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="avatar" id="accountBtn" title="Účet" aria-label="Účet"></button>
    </div>
  </div>
</header>
<main id="app"><div class="loading">Načítavam…</div></main>
<div id="modalRoot"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const CFG = window.F1_CONFIG || {};
const LEAGUE = CFG.leagueName || "F1 Liga";
const $app = document.getElementById("app");
const $modal = document.getElementById("modalRoot");
const DEFAULT_SCHEME = [25,18,15,12,10,8,6,4,2,1];
const PALETTE = ["#ff8000","#3671c6","#27f4d2","#e8002d","#229971","#ff87bc","#64c4ff","#ffd400","#6c3fd1","#52e252","#b6542f","#1e41ff","#b6babd","#0d0f12","#00a19c","#ff5a00"];
document.getElementById("leagueName").textContent = LEAGUE;
document.title = LEAGUE;

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FLAGS = {bahrain:"🇧🇭",jeddah:"🇸🇦",saudi:"🇸🇦",australia:"🇦🇺",melbourne:"🇦🇺",suzuka:"🇯🇵",japan:"🇯🇵",china:"🇨🇳",shanghai:"🇨🇳",miami:"🇺🇸",imola:"🇮🇹",monaco:"🇲🇨",canada:"🇨🇦",montreal:"🇨🇦",barcelona:"🇪🇸",spain:"🇪🇸",madrid:"🇪🇸","red bull":"🇦🇹",austria:"🇦🇹",silverstone:"🇬🇧",hungaroring:"🇭🇺",hungary:"🇭🇺",spa:"🇧🇪",zandvoort:"🇳🇱",monza:"🇮🇹",baku:"🇦🇿",singapore:"🇸🇬",usa:"🇺🇸",austin:"🇺🇸",mexico:"🇲🇽",interlagos:"🇧🇷",brazil:"🇧🇷","las vegas":"🇺🇸",qatar:"🇶🇦","abu dhabi":"🇦🇪",portugal:"🇵🇹",portimao:"🇵🇹",paul:"🇫🇷",france:"🇫🇷"};
const flag = t => { const k = (t || "").toLowerCase(); for (const [n, f] of Object.entries(FLAGS)) if (k.includes(n)) return f; return "🏁"; };
const fmtAvg = v => v == null ? "–" : v.toFixed(1).replace(".", ",");
const plural = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
const fmtDate = d => d ? new Date(d).toLocaleDateString("sk-SK", { day: "numeric", month: "numeric" }) : "";
const textOn = hex => { const n = parseInt((hex || "#000000").slice(1), 16); const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); const L = .2126 * r + .7152 * g + .0722 * b; return L > .32 ? "#0d0f12" : "#ffffff"; };
function toast(msg, kind = "ok") { const t = document.createElement("div"); t.className = "toast " + kind; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), kind === "err" ? 4500 : 2600); }
const errMsg = e => {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "Nesprávny email alebo heslo";
  if (/already registered|already been registered/i.test(m)) return "Tento email už je zaregistrovaný";
  if (/Password should be at least/i.test(m)) return "Heslo musí mať aspoň 6 znakov";
  if (/Email not confirmed/i.test(m)) return "Email ešte nie je potvrdený";
  if (/Unable to validate email|invalid format/i.test(m)) return "Neplatný email";
  if (/players_color_check/.test(m)) return "Neplatná farba";
  if (/permission denied/i.test(m)) return "Na toto nemáš prístup";
  if (/results_race_id_player_id_key/.test(m)) return "Jeden jazdec je v závode dvakrát";
  if (/results_race_id_position_key/.test(m)) return "Dve rovnaké pozície v závode";
  if (/players_name_key/.test(m)) return "Jazdec s týmto menom už existuje";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Nepodarilo sa spojiť so serverom";
  return m;
};

// ---------- state ----------
const S = {
  players: [], seasons: [], races: [], results: [], post: [],
  seasonId: null, tab: "home", view: null, raceView: "cards", hidden: new Set(), h2h: null,
  user: null, profile: null, profiles: [], authTab: "login", edit: null, loaded: false,
};
const configured = CFG.supabaseUrl && CFG.supabaseKey && !/SEM_VLOZ/.test(CFG.supabaseUrl + CFG.supabaseKey);
const sb = configured ? createClient(CFG.supabaseUrl, CFG.supabaseKey) : null;
const ROLE_LABEL = { pending: "Čaká na schválenie", viewer: "Člen", editor: "Zapisovateľ", admin: "Admin" };
const isMember = () => ["viewer", "editor", "admin"].includes(S.profile?.role);
const canEdit = () => ["editor", "admin"].includes(S.profile?.role);
const isAdmin = () => S.profile?.role === "admin";

async function loadProfile() {
  if (!S.user) { S.profile = null; S.profiles = []; return; }
  const { data, error } = await sb.rpc("my_profile");
  S.profile = error ? null : data;
  if (isAdmin()) { const r = await sb.rpc("list_profiles"); S.profiles = r.data || []; } else S.profiles = [];
}
async function fetchAll(table, cols, order = "id") {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from(table).select(cols).order(order).range(from, from + 999);
    if (error) throw error; out.push(...data); if (data.length < 1000) break;
  }
  return out;
}
async function load() {
  const [players, seasons, races, results, post] = await Promise.all([
    fetchAll("players", "id,name,active,color"),
    fetchAll("seasons", "id,name,sort_order,points_scheme,fastest_lap_bonus,is_current"),
    fetchAll("races", "id,season_id,round,track,race_date"),
    fetchAll("results", "id,race_id,player_id,position,fastest_lap"),
    fetchAll("postponements", "season_id,player_id,count", "season_id"),
  ]);
  Object.assign(S, { players, seasons, races, results, post, loaded: true });
  S.seasons.sort((a, b) => a.sort_order - b.sort_order || a.id - b.id);
  if (!S.seasonId || !S.seasons.some(s => s.id === S.seasonId)) S.seasonId = (S.seasons.find(s => s.is_current) || S.seasons[S.seasons.length - 1] || {}).id ?? null;
  idx();
}
function unload() { Object.assign(S, { players: [], seasons: [], races: [], results: [], post: [], loaded: false, edit: null }); idx(); }

// ---------- derived ----------
let P = new Map(), RES_BY_RACE = new Map();
function idx() {
  P = new Map(S.players.map(p => [p.id, p]));
  RES_BY_RACE = new Map();
  for (const r of S.results) { if (!RES_BY_RACE.has(r.race_id)) RES_BY_RACE.set(r.race_id, []); RES_BY_RACE.get(r.race_id).push(r); }
  for (const a of RES_BY_RACE.values()) a.sort((x, y) => x.position - y.position);
}
const season = id => S.seasons.find(s => s.id === id);
const pname = id => P.get(id)?.name ?? "?";
const col = id => { const p = P.get(id); if (p?.color) return p.color; const ids = [...P.keys()].sort((a, b) => a - b); return PALETTE[Math.max(0, ids.indexOf(id)) % PALETTE.length]; };
const cvars = id => `--c:${col(id)};--t:${textOn(col(id))}`;
const posb = (p, small) => `<span class="pos ${p <= 3 ? "p" + p : ""} ${small ? "s" : ""}">${p}</span>`;
const ptsFor = (s, r) => ((s.points_scheme || DEFAULT_SCHEME)[r.position - 1] || 0) + (r.fastest_lap ? (s.fastest_lap_bonus || 0) : 0);
const seasonRaces = sid => S.races.filter(r => r.season_id === sid).sort((a, b) => a.round - b.round);

function standings(sid) {
  const s = season(sid); if (!s) return { rows: [], races: [], done: [] };
  const races = seasonRaces(sid); const done = races.filter(r => RES_BY_RACE.has(r.id));
  const map = new Map();
  const get = pid => { if (!map.has(pid)) map.set(pid, { pid, pts: 0, wins: 0, podiums: 0, starts: 0, posSum: 0, best: null, fl: 0, counts: Array(31).fill(0), odk: 0, cum: [], form: [] }); return map.get(pid); };
  for (const race of done) for (const r of RES_BY_RACE.get(race.id)) {
    const o = get(r.player_id); o.pts += ptsFor(s, r); o.starts++; o.posSum += r.position; o.counts[r.position]++;
    if (r.position === 1) o.wins++; if (r.position <= 3) o.podiums++; if (r.fastest_lap) o.fl++;
    o.best = o.best == null ? r.position : Math.min(o.best, r.position);
  }
  for (const pp of S.post.filter(x => x.season_id === sid && x.count > 0)) get(pp.player_id).odk = pp.count;
  for (const o of map.values()) {
    let acc = 0;
    o.cum = done.map(race => { const r = RES_BY_RACE.get(race.id).find(x => x.player_id === o.pid); if (r) acc += ptsFor(s, r); return acc; });
    o.form = done.slice(-5).map(race => RES_BY_RACE.get(race.id).find(x => x.player_id === o.pid)?.position ?? null);
  }
  const rows = [...map.values()].map(o => ({ ...o, avg: o.starts ? o.posSum / o.starts : null }));
  rows.sort((a, b) => b.pts - a.pts || cmpCounts(a, b) || pname(a.pid).localeCompare(pname(b.pid), "sk"));
  return { rows, races, done, season: s };
}
function cmpCounts(a, b) { for (let i = 1; i <= 30; i++) if (a.counts[i] !== b.counts[i]) return b.counts[i] - a.counts[i]; return 0; }
function isFinished(s) { const r = seasonRaces(s.id); return !s.is_current && r.length > 0 && r.some(x => RES_BY_RACE.has(x.id)); }
function allTime() {
  const map = new Map();
  for (const p of S.players) map.set(p.id, { pid: p.id, pts: 0, wins: 0, podiums: 0, starts: 0, posSum: 0, fl: 0, titles: 0, titleNames: [], seasons: [] });
  for (const s of S.seasons) standings(s.id).rows.forEach((row, i) => {
    const o = map.get(row.pid); if (!o) return;
    o.pts += row.pts; o.wins += row.wins; o.podiums += row.podiums; o.starts += row.starts; o.posSum += row.posSum; o.fl += row.fl;
    o.seasons.push({ sid: s.id, name: s.name, place: i + 1, pts: row.pts, wins: row.wins, podiums: row.podiums, fl: row.fl, starts: row.starts, avg: row.avg, current: s.is_current });
    if (i === 0 && isFinished(s)) { o.titles++; o.titleNames.push(s.name); }
  });
  return [...map.values()].map(o => ({ ...o, avg: o.starts ? o.posSum / o.starts : null }));
}
const formHtml = f => `<span class="form">${f.map(p => p == null ? '<i class="x"></i>' : `<i class="${p <= 3 ? "p" + p : ""}">${p}</i>`).join("")}</span>`;

// ---------- routing ----------
function readHash() {
  const [tab, sid, extra] = location.hash.replace(/^#\/?/, "").split("/");
  if (tab) S.tab = tab;
  if (sid && !isNaN(+sid)) S.seasonId = +sid;
  S.view = extra ? decodeURIComponent(extra) : null;
}
function go(tab, view = null, sid = S.seasonId) {
  const h = `#/${tab}/${sid ?? ""}${view != null ? "/" + encodeURIComponent(view) : ""}`;
  if (location.hash !== h) location.hash = h; else render();
}
window.addEventListener("hashchange", () => {
  readHash(); render(); window.scrollTo({ top: 0 });
  if (S.tab === "admin" && isAdmin()) loadProfile().then(() => { if (S.tab === "admin") { const st = keepOpen(); render(); restoreOpen(st); } });
});

// ---------- shell ----------
const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  standings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h7"/></svg>',
  races: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V4"/><path d="M5 4h14l-3 4 3 4H5"/></svg>',
  players: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>',
  hof: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/></svg>',
  admin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
};
const TABS = [["home","Domov"],["standings","Poradie"],["races","Preteky"],["players","Jazdci"],["hof","Sieň slávy"],["admin","Správa"]];

          ${login ? "" : `<label class="f">Meno alebo prezývka<input class="input" name="dname" required maxlength="40" autocomplete="nickname"></label>`}
          <label class="f">Email<input class="input" type="email" name="email" required autocomplete="email"></label>

let lightsTimer = [];
function runLights() {
  lightsTimer.forEach(clearTimeout); lightsTimer = [];
  const gate = document.getElementById("gate"); if (!gate) return;
  const pods = [...gate.querySelectorAll(".pod")];
  let seen = false; try { seen = sessionStorage.getItem("f1lights") === "1"; } catch {}
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || seen) return;
  try { sessionStorage.setItem("f1lights", "1"); } catch {}
  gate.classList.add("seq");
  pods.forEach((p, i) => lightsTimer.push(setTimeout(() => p.classList.add("on"), 300 + i * 420)));
  lightsTimer.push(setTimeout(() => { pods.forEach(p => p.classList.remove("on")); gate.classList.remove("seq"); gate.classList.add("go"); }, 300 + 5 * 420 + 650));
}

function mountChart() {
  const host = document.getElementById("chart"); if (!host) return;
  const st = standings(S.seasonId);
  const series = st.rows.slice(0, 8).map(r => ({ pid: r.pid, name: pname(r.pid), color: col(r.pid), cum: r.cum }));
  document.getElementById("legend").innerHTML = series.map(s => `<button data-toggle="${s.pid}" class="${S.hidden.has(s.pid) ? "off" : ""}" style="--c:${s.color}"><i></i>${esc(s.name)}</button>`).join("");
  const vis = series.filter(s => !S.hidden.has(s.pid)); const n = st.done.length;
  const W = Math.max(320, host.clientWidth), H = Math.min(420, Math.max(250, W * 0.42));
  const m = { l: 40, r: vis.length && vis.length <= 5 ? 76 : 14, t: 12, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxY = Math.max(10, ...vis.map(s => s.cum[n - 1] || 0)); const step = niceStep(maxY / 4); const top = Math.ceil(maxY / step) * step;
  const x = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1)); const y = v => m.t + ih - v / top * ih;
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? "#d3d7dd" : "#0d0f12"}" stroke-width="${v ? 1 : 2}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5b6170">${v}</text>`;
  const every = Math.ceil(n / Math.max(2, Math.floor(iw / 34)));
  st.done.forEach((r, i) => { if (i % every === 0 || i === n - 1) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#5b6170">${r.round}</text>`; });
  let lines = "";
  for (const s of vis) lines += `<path d="${s.cum.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (vis.length && vis.length <= 5) {
    const labs = vis.map(s => ({ s, y: y(s.cum[n - 1]) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < 15) labs[i].y = labs[i - 1].y + 15;
    for (const l of labs) lines += `<circle cx="${x(n - 1)}" cy="${y(l.s.cum[n - 1])}" r="4.5" fill="${l.s.color}" stroke="#e9ebee" stroke-width="2"/><text x="${x(n - 1) + 9}" y="${l.y + 4}" font-size="13" font-weight="700" fill="#0d0f12">${esc(l.s.name)}</text>`;
  }
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Vývoj bodov">${g}${lines}<line id="xh" y1="${m.t}" y2="${m.t + ih}" stroke="#0d0f12" stroke-width="1" opacity="0"/><g id="dots"></g><rect x="${m.l - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>`;
  const svg = host.querySelector("svg"), tip = host.querySelector("#tip"), xh = host.querySelector("#xh"), dots = host.querySelector("#dots");
  const move = ev => {
    const rect = svg.getBoundingClientRect(); const px = (ev.clientX - rect.left) * W / rect.width;
    const i = Math.max(0, Math.min(n - 1, Math.round(n === 1 ? 0 : (px - m.l) / iw * (n - 1)))); const race = st.done[i];
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("opacity", 1);
    dots.innerHTML = vis.map(s => `<circle cx="${x(i)}" cy="${y(s.cum[i])}" r="5" fill="${s.color}" stroke="#e9ebee" stroke-width="2"/>`).join("");
    tip.innerHTML = `<div class="h">${flag(race.track)} ${esc(race.track)}, kolo ${race.round}</div>` + [...vis].sort((a, b) => b.cum[i] - a.cum[i]).map(s => `<div class="r"><span><i class="sw" style="--c:${s.color}"></i>${esc(s.name)}</span><b class="num">${s.cum[i]}</b></div>`).join("");
    const left = x(i) / W * rect.width; const tw = tip.offsetWidth;
    tip.style.left = (left + 14 + tw > rect.width ? left - tw - 14 : left + 14) + "px"; tip.style.top = "8px"; tip.style.opacity = 1;
  };
  const hit = host.querySelector("#hit");
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.style.opacity = 0; xh.setAttribute("opacity", 0); dots.innerHTML = ""; });
}
function fitText() {
  document.querySelectorAll(".big h2,.p23 b,.dc .top b,.dhero h1,.champ .top b,.gate-title").forEach(el => {
    el.style.fontSize = ""; let fs = parseFloat(getComputedStyle(el).fontSize); const box = el.parentElement;
    const avail = box.clientWidth - parseFloat(getComputedStyle(box).paddingLeft) - parseFloat(getComputedStyle(box).paddingRight);

  });
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1)))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

function playerDetail(pid) {
  const p = P.get(pid); if (!p) return `<div class="empty">Jazdec neexistuje.</div>`;
  const all = allTime(); const a = all.find(x => x.pid === pid);
  const rank = key => [...all].filter(x => x.starts).sort((x, y) => y[key] - x[key]).findIndex(x => x.pid === pid) + 1;
  const mine = S.results.filter(r => r.player_id === pid).map(r => ({ r, race: S.races.find(x => x.id === r.race_id) })).filter(x => x.race)
    .sort((x, y) => (season(x.race.season_id).sort_order - season(y.race.season_id).sort_order) || x.race.round - y.race.round);
  const others = S.players.filter(q => q.id !== pid && S.results.some(r => r.player_id === q.id));
  const opp = S.h2h && S.h2h !== pid && P.get(S.h2h) ? S.h2h : (others[0]?.id ?? null);
  const isMine = S.profile?.player_id === pid;
  let h2h = "";
  if (opp) {
    let ahead = 0, behind = 0, n = 0;
    for (const arr of RES_BY_RACE.values()) { const me = arr.find(x => x.player_id === pid), ot = arr.find(x => x.player_id === opp); if (me && ot) { n++; me.position < ot.position ? ahead++ : behind++; } }
    const pa = n ? ahead / n * 100 : 50;
    h2h = `<div class="h2h"><select class="input" id="h2hSel" style="max-width:320px">${others.map(o => `<option value="${o.id}" ${o.id === opp ? "selected" : ""}>proti ${esc(o.name)}</option>`).join("")}</select>
      ${n ? `<div class="score"><div><strong class="num">${ahead}</strong><div class="mid" style="font-weight:600">${esc(p.name)} vyššie</div></div><span class="mid" style="font-weight:600">${n} spoločných pretekov</span><div style="text-align:right"><strong class="num">${behind}</strong><div class="mid" style="font-weight:600">${esc(pname(opp))} vyššie</div></div></div>
      <div class="bar"><i style="width:${pa}%;background:${col(pid)}"></i><i style="flex:1;background:${col(opp)}"></i></div>` : `<p class="mid">Ešte spolu nejazdili.</p>`}</div>`;
  }
  const kv = [["Body", a.pts, rank("pts")], ["Výhry", a.wins, rank("wins")], ["Pódiá", a.podiums, rank("podiums")], ["Najrýchl. kolá", a.fl, a.fl ? rank("fl") : 0], ["Štarty", a.starts, 0], ["Ø miesto", fmtAvg(a.avg), 0]];
  return `<button class="back" data-go="players">‹ Všetci jazdci</button>
    <div class="dhero" style="${cvars(pid)}"><small style="font-weight:700">${a.titles ? `${a.titles}× šampión (${a.titleNames.map(esc).join(", ")})` : "Jazdec ligy"}</small><h1>${esc(p.name)}</h1>
      <p>${a.seasons.length} ${plural(a.seasons.length, "sezóna", "sezóny", "sezón")}, ${a.starts} ${plural(a.starts, "štart", "štarty", "štartov")}</p>
      ${isMine || canEdit() ? `<div style="margin-top:18px"><button class="btn sm" style="border-color:currentColor;color:inherit" data-color="${pid}">Zmeniť farbu</button></div>` : ""}</div>
    <div class="kv">${kv.map(([k, v, r]) => `<div><strong class="num">${v}</strong><span>${k}</span>${r ? `<em>${r}. v histórii</em>` : ""}</div>`).join("")}</div>
    ${mine.length ? `<div class="sec"><h2>Posledné preteky</h2></div><div class="recent" style="margin-top:14px">${mine.slice(-6).reverse().map(f => `<div data-race="${f.race.id}">${posb(f.r.position)}<span><b>${flag(f.race.track)} ${esc(f.race.track)}</b><small>${esc(season(f.race.season_id).name)}</small></span></div>`).join("")}</div>` : ""}
    <div class="sec"><h2>Po sezónach</h2></div>
    <div class="scroll"><table class="tbl"><thead><tr><th class="l">Sezóna</th><th>Miesto</th><th>Body</th><th>Výhry</th><th>Pódiá</th><th>NK</th><th>Štarty</th></tr></thead>
      <tbody>${a.seasons.map(x => `<tr data-season-go="${x.sid}"><td class="l"><b>${esc(x.name)}</b>${x.current ? ' <span class="pill red">prebieha</span>' : ""}</td><td>${posb(x.place, true)}</td><td class="pt num">${x.pts}</td><td class="st num">${x.wins}</td><td class="st num">${x.podiums}</td><td class="st num">${x.fl || ""}</td><td class="st num">${x.starts}</td></tr>`).join("") || `<tr><td colspan="7" class="l mid">Zatiaľ bez výsledkov</td></tr>`}</tbody></table></div>
    <div class="sec"><h2>Head-to-head</h2></div>${h2h || `<div class="empty">Žiadni súperi.</div>`}`;
}

// ===== HALL OF FAME =====
function viewHof() {
  const all = allTime().filter(a => a.starts);
  const champs = S.seasons.map(s => ({ s, st: standings(s.id) })).filter(x => x.st.rows.length).reverse();
  const board = (key, title, fmt = v => v, filter = () => true) => {
    const val = a => typeof key === "function" ? key(a) : a[key];
    const list = [...all].filter(filter).sort((a, b) => val(b) - val(a)).filter(a => val(a) > 0).slice(0, 5);
    return `<div class="lb"><h3>${title}</h3>${list.map((a, i) => `<div class="rr" data-player="${a.pid}" style="${cvars(a.pid)}">${posb(i + 1, true)}<span class="sw"></span><span class="nm">${esc(pname(a.pid))}</span><span class="pp num">${fmt(val(a))}</span></div>`).join("") || '<p class="mid">Zatiaľ nič</p>'}</div>`;
  };
  return `<div class="phead"><h1>Sieň slávy</h1><div class="side">${champs.length} ${plural(champs.length, "sezóna", "sezóny", "sezón")}</div></div>
    <div class="champs" style="margin-top:24px">${champs.map(({ s, st }) => { const fin = isFinished(s); const w = st.rows[0];
      return `<div class="champ" data-season-go="${s.id}" style="${cvars(w.pid)}"><div class="top"><small>${esc(s.name)}${fin ? ", šampión" : ", zatiaľ vedie"}</small><div><b>${esc(pname(w.pid))}</b><div><span>${w.pts} bodov, ${w.wins} ${plural(w.wins, "výhra", "výhry", "výhier")}</span></div></div></div>
        <div class="rest">${st.rows.slice(1, 3).map((r, i) => `<div class="rr" style="${cvars(r.pid)}">${posb(i + 2, true)}<span class="sw"></span><span class="nm">${esc(pname(r.pid))}</span><span class="pp num">${r.pts}</span></div>`).join("")}</div></div>`; }).join("")}</div>
    <div class="sec"><h2>Historické rebríčky</h2></div>
    <div class="boards" style="margin-top:14px">${board("titles", "Tituly")}${board("wins", "Výhry")}${board("podiums", "Pódiá")}${board("pts", "Body")}${board("fl", "Najrýchlejšie kolá")}
      ${board(a => a.wins / a.starts, "Úspešnosť", v => Math.round(v * 100) + " %", a => a.starts >= 10)}</div>`;
}

// ---------- RPC ----------
async function rpc(fn, args, okMsg) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast(errMsg(error), "err"); if (/oprávnenie|prihlásený|permission/i.test(error.message || "")) { await loadProfile(); render(); } throw error; }
  await Promise.all([load(), loadProfile()]); render();
  if (okMsg) toast(okMsg);
  return data;
}
const keepOpen = () => [...document.querySelectorAll("details.adm")].map(d => d.open);
const restoreOpen = st => document.querySelectorAll("details.adm").forEach((d, i) => { if (st[i] != null) d.open = st[i]; });
async function adminDo(fn, args, msg) { const st = keepOpen(); let ok = true; try { await rpc(fn, args, msg); } catch { ok = false; } restoreOpen(st); return ok; }

function setPreview(c) {
  const pv = document.getElementById("cprev"); if (!pv) return;

async function saveColor(pid, c) {
  const mine = S.profile?.player_id === pid;
  const { error } = mine ? await sb.rpc("set_my_color", { p_color: c }) : await sb.rpc("set_player_color", { p_player_id: pid, p_color: c });

// ---------- auth ----------
async function afterAuth(user) {
  S.user = user; await loadProfile();
  if (isMember() && !S.loaded) { try { await load(); } catch (e) { toast(errMsg(e), "err"); } }
  if (!isMember()) unload();
  render();
}
async function doLogout() { await sb.auth.signOut(); S.user = null; S.profile = null; unload(); closeModal(); location.hash = ""; render(); toast("Odhlásený"); }
async function authSubmit(f) {
  const btn = f.querySelector("button[type=submit]"); if (btn) btn.disabled = true;
  try {
    if (f.id === "loginForm") {
      const { data, error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value }); if (error) throw error;
      await afterAuth(data.user); if (isMember()) toast(`Ahoj ${S.profile?.display_name || ""}`);
    } else if (f.id === "signupForm") {
      const { data, error } = await sb.auth.signUp({ email: f.email.value.trim(), password: f.password.value, options: { data: { display_name: f.dname.value.trim() } } }); if (error) throw error;
      if (data.session) { await afterAuth(data.user); toast(isAdmin() ? "Účet vytvorený, si admin ligy" : "Účet vytvorený"); }
      else toast("Skontroluj email a potvrď registráciu");
    } else if (f.id === "nameForm") {
      const { error } = await sb.rpc("update_my_name", { p_name: f.dname.value }); if (error) throw error;
      await loadProfile(); accountModal(); render(); toast("Meno uložené");
    }

}
function accountModal() {
  if (!S.user || !S.profile) return;
  const pid = S.profile.player_id && P.get(S.profile.player_id) ? S.profile.player_id : null;
  openModal(`<div class="mc"><small class="mid" style="font-weight:600">${esc(S.user.email || "")}</small><h2>${esc(S.profile.display_name)}</h2>
    <span class="pill">${ROLE_LABEL[S.profile.role]}</span> ${pid ? `<span class="pill"><span class="sw" style="--c:${col(pid)}"></span>jazdec ${esc(pname(pid))}</span>` : ""}
    <form id="nameForm" style="display:flex;gap:8px;margin-top:20px"><input class="input" name="dname" value="${esc(S.profile.display_name)}" required aria-label="Meno"><button class="btn" type="submit">Uložiť meno</button></form>
    ${pid ? `<div style="margin-top:14px"><button class="btn" data-color="${pid}"><span class="sw" style="--c:${col(pid)}"></span>Zmeniť moju farbu</button></div>` : `<p class="hint">Farbu si zmeníš, keď ťa admin priradí k jazdcovi.</p>`}
    <div style="display:flex;justify-content:space-between;margin-top:24px"><button class="btn quiet" data-logout>Odhlásiť sa</button><button class="btn solid" data-close>Zavrieť</button></div></div>`, pid ? col(pid) : null);
}

// ---------- modal ----------
function openModal(html, color) { $modal.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" ${color ? `style="--c:${color}"` : ""}>${html}</div></div>`; }
function closeModal() { $modal.innerHTML = ""; }
$modal.addEventListener("click", e => {
  const t = e.target;
  const ed = t.closest("[data-edit-race]"); if (ed) { editRace(+ed.dataset.editRace); return; }
  if (t.classList.contains("modal-bg") || t.closest("[data-close]")) { closeModal(); return; }
  if (t.closest("[data-logout]")) { doLogout(); return; }
  const pk = t.closest("[data-pick]"); if (pk) { setPreview(pk.dataset.pick); return; }
  const sc = t.closest("[data-savecolor]"); if (sc) { saveColor(+sc.dataset.savecolor, sc.dataset.val); return; }
  const cc = t.closest("[data-color]"); if (cc) { colorModal(+cc.dataset.color); return; }
});
$modal.addEventListener("input", e => { if (e.target.id === "cfree") setPreview(e.target.value); });
$modal.addEventListener("submit", e => { e.preventDefault(); authSubmit(e.target); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function editRace(id) {
  const r = S.races.find(x => x.id === id); if (!r) return;
  S.edit = { raceId: id, order: (RES_BY_RACE.get(id) || []).map(x => ({ player_id: x.player_id, fl: x.fastest_lap })) };
  closeModal(); S.seasonId = r.season_id; go("admin");
}

// ---------- events ----------
$app.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-player], [data-race], [data-season-go], [data-go], [data-jump]"); if (!t) return;
  const d = t.dataset;
  if (d.authtab) { S.authTab = d.authtab; render(); return; }
  if (d.logout != null) { doLogout(); return; }
  if (d.recheck != null) { t.disabled = true; await afterAuth(S.user); if (!isMember()) toast("Ešte nie si schválený", "err"); return; }
  if (d.color) { colorModal(+d.color); return; }
  if (d.toggle) { const id = +d.toggle; S.hidden.has(id) ? S.hidden.delete(id) : S.hidden.add(id); mountChart(); return; }
  if (d.rv) { S.raceView = d.rv; render(); return; }
  if (d.strip) { const el = document.getElementById("strip"); el && el.scrollBy({ left: +d.strip * Math.max(290, el.clientWidth * 0.8), behavior: "smooth" }); return; }
  if (d.jump != null) { const el = document.getElementById("strip"); const c = el && el.children[+d.jump]; c && el.scrollTo({ left: c.offsetLeft - el.children[0].offsetLeft, behavior: "smooth" }); return; }
  if (d.editRace) { editRace(+d.editRace); return; }
  if (d.go) { go(d.go); return; }
  if (d.seasonGo) { S.seasonId = +d.seasonGo; S.hidden.clear(); go("standings"); return; }
  if (d.race && t.tagName !== "BUTTON") { raceModal(+d.race); return; }
  if (d.player && t.tagName !== "BUTTON") { go("players", d.player); return; }
  if (!canEdit()) return;
  const ed = S.edit;
  if (d.add) { ed.order.push({ player_id: +d.add, fl: false }); render(); return; }
  if (d.rm != null) { ed.order.splice(+d.rm, 1); render(); return; }
  if (d.up != null) { const i = +d.up; [ed.order[i - 1], ed.order[i]] = [ed.order[i], ed.order[i - 1]]; render(); return; }
  if (d.down != null) { const i = +d.down; [ed.order[i + 1], ed.order[i]] = [ed.order[i], ed.order[i + 1]]; render(); return; }
  if (d.fl != null) { const i = +d.fl; const was = ed.order[i].fl; ed.order.forEach(o => o.fl = false); ed.order[i].fl = !was; render(); return; }
  if (t.id === "resetRes") { ed.order = []; render(); return; }
  if (t.id === "saveRes") {
    t.disabled = true;
    const ok = await adminDo("save_race_results", { p_race_id: ed.raceId, p_results: ed.order.map((o, i) => ({ player_id: o.player_id, position: i + 1, fastest_lap: o.fl })) }, "Výsledky uložené");
    if (!ok) { render(); return; }
    const nx = standings(S.seasonId).races.find(r => !RES_BY_RACE.has(r.id)); if (nx) { S.edit = { raceId: nx.id, order: [] }; render(); }
    return;
  }
  if (t.id === "clearRes") { if (confirm("Naozaj zmazať všetky výsledky tohto závodu?")) await adminDo("clear_race_results", { p_race_id: ed.raceId }, "Výsledky zmazané"); return; }
  if (d.delrace) { const r = S.races.find(x => x.id === +d.delrace); if (confirm(`Zmazať závod ${r.track}${RES_BY_RACE.has(r.id) ? " aj s výsledkami" : ""}?`)) await adminDo("delete_race", { p_race_id: r.id }, "Závod zmazaný"); return; }
  if (d.pactive) { const p = P.get(+d.pactive); await adminDo("update_player", { p_player_id: p.id, p_name: p.name, p_active: !p.active }, "Uložené"); return; }
  if (d.odk) { const pid = +d.odk; const c = S.post.find(x => x.season_id === S.seasonId && x.player_id === pid)?.count || 0; await adminDo("set_postponements", { p_season_id: S.seasonId, p_player_id: pid, p_count: c + (+d.d) }); return; }
  if (d.approve) { await adminDo("set_user_role", { p_user_id: d.approve, p_role: "viewer" }, "Schválené"); return; }
});
$app.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "raceSel") { const id = +t.value; S.edit = { raceId: id, order: (RES_BY_RACE.get(id) || []).map(x => ({ player_id: x.player_id, fl: x.fastest_lap })) }; render(); return; }
  if (t.id === "h2hSel") { S.h2h = +t.value; render(); return; }
  if (t.dataset.role) { await adminDo("set_user_role", { p_user_id: t.dataset.role, p_role: t.value }, "Prístup zmenený"); return; }
  if (t.dataset.uplayer) { await adminDo("set_user_player", { p_user_id: t.dataset.uplayer, p_player_id: t.value ? +t.value : null }, "Jazdec priradený"); return; }
  if (t.dataset.track || t.dataset.date) {
    const id = +(t.dataset.track || t.dataset.date); const r = S.races.find(x => x.id === id);
    const track = t.dataset.track ? t.value.trim() : r.track; const date = t.dataset.date ? (t.value || null) : r.race_date;
    if (!track) { t.value = r.track; return; }
    await adminDo("update_race", { p_race_id: id, p_track: track, p_race_date: date }, "Uložené"); return;
  }
  if (t.dataset.pname) { const p = P.get(+t.dataset.pname); const name = t.value.trim(); if (!name || name === p.name) { t.value = p.name; return; }
    await adminDo("update_player", { p_player_id: p.id, p_name: name, p_active: p.active }, "Uložené"); return; }
});
$app.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "loginForm" || f.id === "signupForm") { authSubmit(f); return; }
  if (f.id === "addRaceForm") { await adminDo("add_race", { p_season_id: S.seasonId, p_track: document.getElementById("newTrack").value }, "Závod pridaný"); return; }
  if (f.id === "addPlayerForm") { await adminDo("add_player", { p_name: document.getElementById("newPlayer").value }, "Jazdec pridaný"); return; }
  if (f.id === "seasonForm") {
    const scheme = document.getElementById("sScheme").value.split(/[,;\s]+/).filter(Boolean).map(Number);
    if (!scheme.length || scheme.some(n => !Number.isInteger(n) || n < 0)) { toast("Body musia byť celé čísla oddelené čiarkou", "err"); return; }
    await adminDo("update_season", { p_season_id: S.seasonId, p_name: document.getElementById("sName").value, p_points_scheme: scheme, p_fastest_lap_bonus: +document.getElementById("sFl").value || 0, p_is_current: document.getElementById("sCur").checked }, "Sezóna uložená"); return;
  }
  if (f.id === "newSeasonForm") {
    const copy = document.getElementById("nsCopy").value;
    try { const id = await rpc("create_season", { p_name: document.getElementById("nsName").value, p_copy_from_season: copy ? +copy : null, p_make_current: document.getElementById("nsCur").checked }, "Sezóna vytvorená"); S.seasonId = id; S.edit = null; go("admin"); } catch {}
  }
});
$app.addEventListener("pointerdown", e => {
  const h = e.target.closest("[data-drag]"); if (!h || !S.edit) return;
  e.preventDefault();
  const rows = [...h.closest(".order").querySelectorAll(".orow")];
  const from = +h.dataset.drag, row = rows[from], startY = e.clientY;
  const rects = rows.map(r => r.getBoundingClientRect()); const gap = rects.length > 1 ? rects[1].top - rects[0].top : rects[0].height + 6;
  let to = from; row.classList.add("dragging");
  try { h.setPointerCapture(e.pointerId); } catch {}
  const move = ev => {
    const dy = ev.clientY - startY; row.style.transform = `translateY(${dy}px)`;
    const yy = rects[from].top + rects[from].height / 2 + dy;
    to = rects.findIndex(r => yy < r.bottom); if (to === -1) to = rows.length - 1;
    rows.forEach((r, i) => { if (i === from) return; let sh = 0; if (from < to && i > from && i <= to) sh = -gap; if (from > to && i < from && i >= to) sh = gap; r.style.transform = sh ? `translateY(${sh}px)` : ""; });
  };
  const up = () => {
    h.removeEventListener("pointermove", move); h.removeEventListener("pointerup", up); h.removeEventListener("pointercancel", up);
    if (to !== from) { const [it] = S.edit.order.splice(from, 1); S.edit.order.splice(to, 0, it); }
    const st = keepOpen(); render(); restoreOpen(st);
  };
  h.addEventListener("pointermove", move); h.addEventListener("pointerup", up); h.addEventListener("pointercancel", up);
});
function positionStrip() {
  const el = document.getElementById("strip"); if (!el) return;
  const cards = [...el.children]; if (!cards.length) return;
  const nextIdx = standings(S.seasonId).races.findIndex(r => !RES_BY_RACE.has(r.id));
  const i = nextIdx === -1 ? cards.length - 1 : nextIdx; const base = cards[0].offsetLeft;
  el.style.scrollBehavior = "auto";
  if (el.clientWidth < cards[0].offsetWidth * 2) el.scrollLeft = cards[Math.max(0, nextIdx === -1 ? i : i - 1)].offsetLeft - base;
  else el.scrollLeft = Math.max(0, cards[i].offsetLeft - base - el.clientWidth + cards[i].offsetWidth + 4);
  el.style.scrollBehavior = "";
  el.onwheel = e => { if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; const max = el.scrollWidth - el.clientWidth;
    if ((e.deltaY < 0 && el.scrollLeft <= 0) || (e.deltaY > 0 && el.scrollLeft >= max - 1)) return;
    e.preventDefault(); el.style.scrollBehavior = "auto"; el.scrollLeft += e.deltaY; el.style.scrollBehavior = ""; };
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === "standings") mountChart(); fitText(); }, 150); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitText());

readHash();
(async () => {
  if (!configured) { render(); return; }
  try {
    const { data } = await sb.auth.getSession();
    S.user = data.session?.user || null;
    if (S.user) await afterAuth(S.user); else render();
    sb.auth.onAuthStateChange((ev, session) => {
      const u = session?.user || null; if ((u?.id || null) === (S.user?.id || null)) return;
      setTimeout(() => { if (u) afterAuth(u); else { S.user = null; S.profile = null; unload(); render(); } }, 0);
    });
  } catch (e) {
    $app.innerHTML = `<div class="wrap"><div class="empty"><h2 class="d up" style="font-size:48px">Nepodarilo sa načítať</h2><p>${esc(errMsg(e))}</p><p>Ak bol projekt v Supabase dlho neaktívny, mohol sa pozastaviť. Obnovíš ho v Supabase dashboarde.</p><button class="btn solid" onclick="location.reload()">Skúsiť znova</button></div></div>`;
  }
})();
